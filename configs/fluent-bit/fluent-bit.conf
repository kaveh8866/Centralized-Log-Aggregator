# Fluent Bit pipeline — Docker container logs -> Grafana Loki
# Docs: https://docs.fluentbit.io/manual/pipeline/outputs/loki
#
# Design notes (low-spec friendly):
#   * Filesystem buffering + a 256 MB backlog cap: Loki can be down for a while
#     without dropping logs and without filling the root disk.
#   * Mem_Buf_Limit keeps the collector inside its 256 MB container limit.
#   * Constant-ish labels only (job/genvironment/host/stream). Container ids are
#     kept as a log field (`container_log`), never as a Loki label, to avoid
#     cardinality explosions.
#   * No Docker socket mount: the collector only reads log files.

[SERVICE]
    Flush                     1
    Grace                     30
    Daemon                    Off
    Log_Level                 info
    Parsers_File              parsers.conf
    HTTP_Server               On
    HTTP_Listen               0.0.0.0
    HTTP_Port                 2020
    Health_Check              On
    HC_Errors_Count           5
    HC_Retry_Failure_Count    5
    HC_Period                 60
    storage.path              /fluent-bit/buffer
    storage.sync              normal
    storage.checksum          off
    storage.backlog.mem_limit 5M

[INPUT]
    Name              tail
    # Docker's default json-file driver layout (also used by containerd's
    # docker driver). One file per container, rotated by Docker.
    Path              /var/lib/docker/containers/*/*-json.log
    Path_Key          container_log
    Tag               docker
    Parser            docker
    DB                /fluent-bit/buffer/tail.db
    DB.locking        true
    storage.type      filesystem
    Mem_Buf_Limit     16MB
    Skip_Long_Lines   On
    Skip_Empty_Lines  On
    Refresh_Interval  10
    Rotate_Wait       5

[FILTER]
    Name              record_modifier
    Match             docker
    # Host/cluster identity is injected from the environment so the same image
    # can run on any cloud. ${LOG_HOST_LABEL} is provided by docker-compose.
    Record            host ${LOG_HOST_LABEL}
    Record            cluster ${LOG_CLUSTER_LABEL}
    Record            pipeline cloudguard-log-aggregator

[OUTPUT]
    Name                      loki
    Match                     docker
    Host                      loki
    Port                      3100
    # Labels must stay low-cardinality: Loki indexes them, it does not index
    # the log body. `$field` references a record key.
    Labels                    job=fluentbit,cluster=$cluster,host=$host,stream=$stream
    Label_Keys                $job
    Line_Format               json
    Auto_Kubernetes_Labels    off
    Retry_Limit               False
    Storage.total_limit_size  256M
    # Batching is driven by the SERVICE Flush interval above. The Loki output in
    # Fluent Bit 3.1 has no batch_wait / http_allow_duplicates properties, and
    # unknown keys abort output initialisation (exit 1) rather than warning.
