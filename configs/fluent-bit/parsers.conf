# Parsers for Docker's json-file (and containerd docker-driver) log format:
#   {"log":"...","stream":"stdout","time":"2026-11-12T09:00:00.123456789Z"}
#
# Time_Keep On keeps the original timestamp field on the record so the event
# time in Loki matches the moment the container wrote the line — not the moment
# Fluent Bit picked it up. That distinction matters when a buffer backlog is
# flushed after a Loki restart.

[PARSER]
    Name        docker
    Format      json
    Time_Key    time
    Time_Format %Y-%m-%dT%H:%M:%S.%L
    Time_Keep   On
    Decode_Field_As   escaped_utf8    log    do_next
    Decode_Field_As   json             log
