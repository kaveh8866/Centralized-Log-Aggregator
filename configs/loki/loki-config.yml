# Grafana Loki 3.x — single-binary, filesystem storage, TSDB index.
#
# Tuned to stay inside ~512 MB RSS on a small ARM VM:
#   * one ingester/querier process (single binary) instead of microservices
#   * small chunks + short chunk age, so WAL and memory stay bounded
#   * conservative ingestion limits that reject a runaway producer instead of
#     letting it swap the host
#   * compactor-driven retention (14 days) so local disk cannot grow forever
#
# Auth is disabled because Loki is only reachable on the internal compose
# network (port 3100 is published for local debugging, never for the internet).

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  http_server_read_timeout: 60s
  http_server_write_timeout: 60s
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-04-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache
  filesystem:
    directory: /loki/chunks

ingester:
  chunk_idle_period: 5m
  chunk_block_size: 262144
  chunk_target_size: 1048576
  chunk_encoding: snappy
  max_chunk_age: 30m
  autoforget_unhealthy: true
  wal:
    enabled: true
    dir: /loki/wal

limits_config:
  retention_period: 336h
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  ingestion_rate_mb: 4
  ingestion_burst_size_mb: 8
  per_stream_rate_limit: 3MB
  per_stream_rate_limit_burst: 15MB
  max_streams_per_user: 5000
  max_query_series: 500
  max_entries_limit_per_query: 5000
  query_timeout: 60s
  allow_structured_metadata: true
  split_queries_by_interval: 30m

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  # Required from Loki 3.0: where delete requests are persisted.
  delete_request_store: filesystem

querier:
  # Query timeouts are a *limit*, not a querier field: Loki 3.x has no
  # querier.query_timeout and fails config parsing if it is set here.
  max_concurrent: 2

query_range:
  align_queries_with_step: true
  cache_results: false

analytics:
  reporting_enabled: false
