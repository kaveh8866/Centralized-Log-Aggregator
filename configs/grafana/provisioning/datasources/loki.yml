# Grafana datasource provisioning.
# Loki is the default datasource, so every new Explore session and dashboard
# opens against the log store without any click-through setup.

apiVersion: 1

datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    # Service name on the compose network — never a public address.
    url: http://loki:3100
    isDefault: true
    editable: false
    jsonData:
      timeout: 60
      maxLines: 1000
      httpHeaderTimeout: 30
